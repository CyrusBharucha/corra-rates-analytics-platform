name: Keep Streamlit app awake

# Runs every 6 hours, well inside Community Cloud's ~12-hour sleep window.
# GitHub disables scheduled runs after 60 days of repo inactivity; a manual
# workflow_dispatch re-arms it.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright Chromium
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Visit the app
        env:
          APP_URL: https://corra-rates-analytics-platform-3ncvfa6f4pv2ytsc3pauy7.streamlit.app/
        run: python .github/scripts/keep_awake.py
